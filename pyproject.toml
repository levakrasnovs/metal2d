[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metal2d"
version = "0.3.0"
description = "Readable 2D depictions of coordination and organometallic complexes for RDKit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lev Krasnov", email = "lewa.krasnovs@gmail.com" }]
keywords = [
    "rdkit", "cheminformatics", "chemistry", "depiction",
    "coordination chemistry", "organometallic", "metal complexes",
    "2D coordinates", "structure diagram",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["rdkit>=2022.9", "numpy>=1.21"]

[project.optional-dependencies]
png = ["cairosvg>=2.5"]
progress = ["tqdm"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/levakrasnovs/metal2d"
Issues = "https://github.com/levakrasnovs/metal2d/issues"

[project.scripts]
metal2d = "metal2d.cli:main"

[tool.hatch.build]
# .gitignore blocks "data/" to keep source databases out of the repo; the
# package's own data directory has to be re-included explicitly
artifacts = ["metal2d/data/*.smi"]

[tool.hatch.build.targets.wheel]
packages = ["metal2d"]

[tool.hatch.build.targets.sdist]
include = ["metal2d", "tests", "examples", "images", "README.md",
           "CHANGELOG.md", "LICENSE"]
